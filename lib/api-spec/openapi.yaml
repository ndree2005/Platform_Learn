# lib/api-spec/openapi.yaml
openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
tags:
  - name: health
    description: Health checks
  - name: courses
    description: Course operations
  - name: assignments
    description: Assignment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courses:
    get:
      operationId: getCourses
      tags: [courses]
      summary: Get all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    put:
      operationId: updateCourse
      tags: [courses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Course deleted

  /courses/{id}/enrollments:
    post:
      operationId: enrollCourse
      tags: [courses]
      summary: Enroll a student in a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollCourseInput"
      responses:
        "200":
          description: Student enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Course not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    Course:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        instructorId:
          type: string
        instructorName:
          type: string
        category:
          type: string
        level:
          type: string
          enum:
            - Beginner
            - Intermediate
            - Advanced
        duration:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        enrolledStudents:
          type: array
          items:
            type: string
        rating:
          type: number
        isPublished:
          type: boolean
        createdAt:
          type: string
        color:
          type: string
      required:
        - id
        - title
        - description
        - instructorId
        - instructorName
        - category
        - level
        - duration
        - lessons
        - enrolledStudents
        - rating
        - isPublished
        - createdAt
        - color
    CourseInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        instructorId:
          type: string
        instructorName:
          type: string
        category:
          type: string
        level:
          type: string
          enum:
            - Beginner
            - Intermediate
            - Advanced
        duration:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        isPublished:
          type: boolean
        color:
          type: string
      required:
        - title
        - description
    EnrollCourseInput:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    Lesson:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        title:
          type: string
        duration:
          type: string
        type:
          type: string
          enum:
            - video
            - reading
            - quiz
        order:
          type: integer
      required:
        - id
        - courseId
        - title
        - duration
        - type
        - order
